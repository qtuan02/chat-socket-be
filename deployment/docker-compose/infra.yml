name: "chat-socket"
services:
  chat-socket-db:
    image: postgres:18-alpine
    container_name: chat-socket-db
    environment:
      - POSTGRES_DB=chat-socket-db
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=123456
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 500m

  chat-socket-redis:
    image: redis:7-alpine
    container_name: chat-socket-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 128m
