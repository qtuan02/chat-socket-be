version: "3"

vars:
  GOOS: "{{default OS .GOOS}}"
  # MVNW: '{{if eq .GOOS "windows"}}mvnw.cmd{{else}}./mvnw{{end}}' <- Mac OS
  MVNW: '{{if eq .GOOS "windows"}}cmd /c mvnw.cmd{{else}}./mvnw{{end}}'
  DC_DIR: "deployment/docker-compose"
  INFRA_DC_FILE: "{{.DC_DIR}}/infra.yml"
  SLEEP_CMD: '{{if eq .GOOS "windows"}}timeout{{else}}sleep{{end}}'

tasks:
  format:
    cmds:
      - "{{.MVNW}} spotless:check"

  format_fix:
    cmds:
      - "{{.MVNW}} spotless:apply"

  # build:
  #   cmds:
  #     - "{{.MVNW}} -pl chat-socket spring-boot:build-image -DskipTests"

  start_infra:
    cmds:
      - "docker compose -f {{.INFRA_DC_FILE}} up -d"

  stop_infra:
    cmds:
      - "docker compose -f {{.INFRA_DC_FILE}} stop"
      - "docker compose -f {{.INFRA_DC_FILE}} rm -f"

  restart_infra:
    cmds:
      - task: stop_infra
      - task: sleep
      - task: start_infra

  sleep:
    vars:
      DURATION: "{{default 5 .DURATION}}"
    cmds:
      - "{{.SLEEP_CMD}} {{.DURATION}}"

  run:
    cmds:
      - "{{.MVNW}} spring-boot:run"

  flyway_repair:
    cmds:
      - "{{.MVNW}} flyway:repair -Dflyway.url=jdbc:postgresql://localhost:5432/chat-socket-db -Dflyway.user=admin -Dflyway.password=123456"

  compile_without_test:
    cmds:
      - "{{.MVNW}} -q -DskipTests clean compile"
